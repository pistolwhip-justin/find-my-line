name: Create Find-My-Line Project

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: 'Create a new project even if one with the same name already exists'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  create-project:
    runs-on: ubuntu-latest
    steps:
      - name: Create project and phased development backlog
        env:
          GH_TOKEN: ${{ secrets.FIND_MY_LINE_PROJECT_TOKEN }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RECREATE: ${{ inputs.recreate }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="pistolwhip-justin"
          PROJECT_TITLE="Find-My-Line Development"
          RESOURCE_DOC="https://github.com/pistolwhip-justin/find-my-line/blob/main/PHASE_RESOURCES.md"
          MARKETING_DOC="https://github.com/pistolwhip-justin/find-my-line/blob/main/MARKETING_PLAN.md"

          echo "Checking project access..."
          gh api graphql -f query='query { viewer { login } }' >/dev/null

          OWNER_ID=$(gh api graphql -f query='query($login:String!){ user(login:$login){ id } }' -f login="$OWNER" --jq '.data.user.id')

          EXISTING_ID=$(gh api graphql -f query='query($login:String!){ user(login:$login){ projectsV2(first:100){ nodes { id title number url } } } }' -f login="$OWNER" --jq --arg title "$PROJECT_TITLE" '.data.user.projectsV2.nodes[] | select(.title==$title) | .id' | head -n1 || true)

          if [[ -n "${EXISTING_ID:-}" && "$RECREATE" != "true" ]]; then
            echo "Project already exists. Nothing to create."
            gh api graphql -f query='query($login:String!){ user(login:$login){ projectsV2(first:100){ nodes { id title number url } } } }' -f login="$OWNER" --jq --arg title "$PROJECT_TITLE" '.data.user.projectsV2.nodes[] | select(.title==$title) | {title,number,url}'
            exit 0
          fi

          echo "Creating project: $PROJECT_TITLE"
          PROJECT_ID=$(gh api graphql -f query='mutation($owner:ID!,$title:String!){ createProjectV2(input:{ownerId:$owner,title:$title}){ projectV2 { id number url title } } }' -F owner="$OWNER_ID" -f title="$PROJECT_TITLE" --jq '.data.createProjectV2.projectV2.id')

          PROJECT_URL=$(gh api graphql -f query='query($id:ID!){ node(id:$id){ ... on ProjectV2 { url number title } } }' -f id="$PROJECT_ID" --jq '.data.node.url')
          echo "PROJECT_URL=$PROJECT_URL" >> "$GITHUB_STEP_SUMMARY"

          declare -a TITLES=(
            "[Phase 0] Project foundation"
            "[Phase 1] First usable route generator"
            "[Phase 2] Better route intelligence"
            "[Phase 3] Centralized regional data and offline datasets"
            "[Phase 4] Offline on-device AI"
            "[Phase 5] Community route intelligence"
            "[Phase 6] Expanded exports and interoperability"
            "[Phase 7] Advanced route discovery"
            "[Phase 8] Mature ecosystem integrations"
            "[Marketing] Cross-phase user testing and growth program"
          )

          declare -a BODIES=(
            "## Goal\nEstablish the repository structure, architecture decisions, test strategy, and first geographic test region.\n\n## Deliverable\nA reproducible development workflow plus a defined region/data-pipeline target.\n\n## Work\n- Android project foundation\n- Module boundaries\n- Test architecture\n- First geographic test region\n- Source/version conventions\n- CI/build/test workflow\n\n## Acceptance test\nThe project can acquire the selected source data, identify its version, and run initial build/data-processing tests."
            "## Goal\nProve the central route-discovery idea without AI or community complexity.\n\n## Capabilities\n- Start and destination\n- Basic bikepacking preferences\n- One regional dataset\n- Existing routing engine, with BRouter evaluated first\n- Bikepacking routing profile\n- Multiple candidate routes where practical\n- Basic statistics\n- Offline route/map display\n- GPX export\n\n## Explicitly excluded\nTurn-by-turn navigation, live rerouting, user accounts, social features, on-device AI, and direct navigation APIs.\n\n## Acceptance test\nA rider can enter two locations, generate useful bikepacking candidates, compare them, export one as GPX, and open/use it in an existing navigation application."
            "## Goal\nMake generated lines substantially better than basic bicycle routing.\n\n## Capabilities\n- Better surface classification\n- Better road/trail suitability\n- Access and legality handling\n- Better elevation analysis\n- Traffic/road-class penalties\n- More meaningful alternative generation\n- Route tradeoff explanations\n- More detailed statistics\n\n## Acceptance test\nThe same request produces materially different candidates with understandable tradeoffs, and real-world testing explains why candidates succeed or fail for a stated riding style."
            "## Goal\nBuild the centralized data foundation required for scalable offline planning.\n\n## Capabilities\n- Source-specific ingestion adapters\n- OSM normalization\n- Licensed government/public datasets\n- Legally usable community/specialized data\n- Geographic matching and deduplication\n- Provenance and confidence\n- Versioned regional datasets\n- Regional packaging\n- Incremental/delta updates\n\n## Acceptance test\nA phone can install a selected region, plan within it without a network connection, and update it incrementally without redownloading the complete region."
            "## Goal\nAdd conversational route planning without requiring a network connection.\n\n## Capabilities\n- Small specialized local model\n- Natural-language ride requests\n- Natural-language preference changes\n- Structured preference output\n- Candidate-route interpretation\n- Conversational route comparison\n- Offline operation with installed regional data\n\n## Critical boundary\nThe AI translates and evaluates. It does not invent route geometry.\n\n## Benchmark\nMeasure preference extraction accuracy, constraint consistency, ambiguity handling, resistance to hallucinated route facts, candidate comparison accuracy, model size, memory use, latency, and battery impact. Test multiple small models and keep the smallest model that meets the quality threshold.\n\n## Acceptance test\nA rider can describe a ride naturally, the offline model converts it into valid structured preferences, the routing engine generates candidates, and the model accurately explains their tradeoffs."
            "## Goal\nTurn completed rides into useful feedback for future route generation without turning Find-My-Line into a general social network.\n\n## Capabilities\n- Optional post-ride feedback\n- GPX/FIT import where available\n- Section-level feedback\n- Condition reports\n- Route reviews\n- Privacy controls\n- Anonymous/public contribution options\n- Time-decayed condition information\n- Feedback incorporated into route evaluation\n\n## Acceptance test\nA completed ride can be imported or submitted, sections can be evaluated, and repeated evidence measurably influences future route selection while preserving uncertainty and provenance."
            "## Goal\nReduce friction between route discovery and the rider's existing navigation tools.\n\n## Capabilities\n- KML/KMZ\n- GeoJSON\n- TCX\n- FIT where practical\n- Android share workflows\n- Direct handoff to compatible navigation applications\n- Direct track import where supported\n\n## Strategic rule\nInteroperability is additive. Portable GPX/FIT-style export remains available even when direct integrations exist.\n\n## Acceptance test\nA rider can send a generated line into supported navigation tools with substantially less manual work while Find-My-Line remains independently useful."
            "## Goal\nImprove discovery of lines riders would not normally connect manually.\n\n## Potential capabilities\n- Detect promising unconnected corridors\n- Compare against known/public route networks\n- Identify likely new connections\n- Detect likely hike-a-bike sections\n- Better remoteness/scenic estimates\n- Resupply and bailout intelligence\n- Improved condition prediction\n- Route novelty analysis\n- Advanced community-derived suitability signals\n\n## Acceptance test\nReal riders can identify useful route connections not obvious from existing published route collections, and field testing validates a meaningful proportion of discoveries."
            "## Goal\nMake Find-My-Line a route-discovery layer that works naturally with the broader navigation ecosystem.\n\n## Scope\nEvaluate integrations with navigation apps, GPS computers, route-management services, and other tools where APIs and agreements permit.\n\n## Strategic constraint\nThis phase comes last. Find-My-Line must first establish that its route-discovery engine and community/data intelligence are valuable independently.\n\n## Acceptance test\nSupported integrations reduce friction without making Find-My-Line dependent on any single navigation provider."
            "## Goal\nRun user acquisition and testing as a continuous product-development function.\n\n## Master document\n$MARKETING_DOC\n\n## Operating principle\nRecruit the right riders in controlled waves. User growth is intended to increase route validation, usability feedback, real-world evidence, content and confidence—not simply downloads.\n\n## Phase targets\n- Phase 0: 0–10 design partners\n- Phase 1: 10–25 active testers\n- Phase 2: 25–75 active testers; approximately 35–100 cumulative\n- Phase 3: 50–150 active testers; approximately 85–250 cumulative\n- Phase 4: 100–300 active testers; approximately 185–550 cumulative\n- Phase 5: 250–750 active testers; approximately 435–1,300 cumulative\n- Phase 6: 500–1,500 active testers; approximately 935–2,800 cumulative\n- Phase 7: 1,000–3,000 active testers; approximately 1,935–5,800 cumulative\n- Phase 8: 3,000–10,000+ active testers; approximately 4,935–15,800+ cumulative\n\n## Acquisition channels\n- Personal outreach and founding rider/design partners\n- Relevant bikepacking, gravel and cycling communities\n- Regional rider groups and clubs\n- Referrals from existing testers\n- Validated ride reports and route-discovery case studies\n- Search-friendly website content\n- Regional ambassadors beginning in Phase 5\n- Partnerships and ecosystem outreach in later phases\n\n## Core measurements\nTrack active testers, activation, routes generated, routes selected/exported, routes actually ridden, feedback per tester, route problems, repeat use, referrals, acquisition source, cost per activated tester, time-to-feedback, and verified route examples.\n\n## Growth gate\nDo not increase recruitment faster than the project can process feedback, fix route/data problems, support users, and protect user privacy. Increase recruitment when the current cohort is generating actionable evidence and onboarding/support are repeatable.\n\n## Acceptance test\nEvery active development phase has an appropriate tester cohort, a defined acquisition method, measurable feedback goals, and a decision about whether the next recruitment wave should grow, hold, or shrink."
          )

          declare -a RESOURCES=(
            "**Resources / budget:** GitHub public repo + Actions ($0), Android Studio/SDK/NDK ($0), Kotlin/Gradle ($0), one representative Android test device. **Phase target: $0.** Detailed checklist: $RESOURCE_DOC"
            "**Resources / budget:** Geofabrik/OSM regional data ($0), BRouter ($0, MIT), Mapsforge or MapLibre Native ($0 library cost), GPX library ($0). **Phase target: $0 baseline; roughly $0–$25 optional testing/storage.** Detailed sources/costs: $RESOURCE_DOC"
            "**Resources / budget:** OSM/Geofabrik ($0), BRouter profiles ($0), USGS 3DEP ($0 for public datasets), USFS/BLM/NPS/state GIS where permitted (generally $0), local processing. **Phase target: $0–$50/month.** Detailed sources/costs: $RESOURCE_DOC"
            "**Resources / budget:** Geofabrik daily extracts ($0), public GIS ($0 where available), GitHub Actions ($0 for standard runners in public repos), R2/B2 object storage ($0 initially). **Phase target: $0–$20/month initially.** Detailed storage pricing: $RESOURCE_DOC"
            "**Resources / budget:** llama.cpp ($0), candidate small local models such as Gemma 3n ($0 where license/terms permit), project benchmark corpus ($0), representative Android devices. **Phase target: $0 production cost; $0–$50/month optional benchmarking compute.** Detailed model/runtime sources: $RESOURCE_DOC"
            "**Resources / budget:** GPX/FIT processing ($0), Supabase Free ($0 initially), R2/B2 ($0 initially), privacy/consent architecture. Supabase Pro currently starts at $25/month if needed. **Phase target: $0–$25/month early testing.** Detailed backend/storage costs: $RESOURCE_DOC"
            "**Resources / budget:** GPX/KML/KMZ/GeoJSON/TCX/FIT formats ($0), Android share/intents ($0), official vendor APIs/SDKs where available. **Phase target: $0–$25/month, excluding vendor-specific agreements.** Detailed interoperability resources: $RESOURCE_DOC"
            "**Resources / budget:** mature Phase 3 regional data + Phase 5 ride history, public GIS, additional processing compute. **Phase target: $0–$100/month initially; pay only when measured workload requires it.** Detailed requirements: $RESOURCE_DOC"
            "**Resources / budget:** official vendor APIs/SDKs, partnership/contact channels, production backend, monitoring. **Phase target: $0–$150/month initially, excluding legal/business/vendor agreements.** Detailed requirements: $RESOURCE_DOC"
            "**Resources / budget:** Marketing is intentionally organic-first through the early phases. Phase 0–2 target paid acquisition: $0. Phase 3–5: $0–$100/month only for measured experiments. Phase 6–7: $0–$250/month initially if justified. Phase 8: scale paid spend only after retention/referral evidence supports it. Detailed targets, channels, cohort sizes and KPIs: $MARKETING_DOC"
          )

          echo "Creating phased development issues and adding them to the project..."

          for i in "${!TITLES[@]}"; do
            TITLE="${TITLES[$i]}"
            BODY="${BODIES[$i]}\n\n## Resource readiness\n${RESOURCES[$i]}\n\n**Rule:** No paid dependency is required merely for convenience. Before starting this phase, confirm the required resources are available, licenses are checked, secrets are secured, and a free/open-source fallback exists for every paid dependency."

            ISSUE_NUMBER=$(GH_TOKEN="$REPO_TOKEN" gh issue list --repo "$REPO" --state all --search "in:title \"$TITLE\"" --json number,title --jq --arg title "$TITLE" '.[] | select(.title==$title) | .number' | head -n1 || true)

            if [[ -z "${ISSUE_NUMBER:-}" ]]; then
              ISSUE_URL=$(GH_TOKEN="$REPO_TOKEN" gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY")
              ISSUE_NUMBER="${ISSUE_URL##*/}"
              echo "Created issue #$ISSUE_NUMBER: $TITLE"
            else
              echo "Issue #$ISSUE_NUMBER already exists: $TITLE"
            fi

            ISSUE_NODE_ID=$(GH_TOKEN="$REPO_TOKEN" gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json id --jq '.id')
            gh api graphql -f query='mutation($project:ID!,$content:ID!){ addProjectV2ItemById(input:{projectId:$project,contentId:$content}){ item { id } } }' -f project="$PROJECT_ID" -f content="$ISSUE_NODE_ID" >/dev/null
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "# Find-My-Line Project" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Project: **[$PROJECT_TITLE]($PROJECT_URL)**" >> "$GITHUB_STEP_SUMMARY"
          echo "Resource plan: **[$RESOURCE_DOC]($RESOURCE_DOC)**" >> "$GITHUB_STEP_SUMMARY"
          echo "Marketing/user-testing plan: **[$MARKETING_DOC]($MARKETING_DOC)**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Phased development backlog: 9 milestone issues (Phase 0 through Phase 8) plus one cross-phase marketing/user-testing issue." >> "$GITHUB_STEP_SUMMARY"
          echo "Marketing is treated as a product-development input: cohort size, acquisition channel, feedback goals and growth gates are planned alongside engineering." >> "$GITHUB_STEP_SUMMARY"
