name: Create Find-My-Line Project

on:
  workflow_dispatch:
    inputs:
      recreate:
        description: 'Create a new project even if one with the same name already exists'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  create-project:
    runs-on: ubuntu-latest
    steps:
      - name: Create project and phased development backlog
        env:
          GH_TOKEN: ${{ secrets.FIND_MY_LINE_PROJECT_TOKEN }}
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RECREATE: ${{ inputs.recreate }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="pistolwhip-justin"
          PROJECT_TITLE="Find-My-Line Development"

          echo "Checking project access..."
          gh api graphql -f query='query { viewer { login } }' >/dev/null

          echo "Getting owner node ID..."
          OWNER_ID=$(gh api graphql -f query='query($login:String!){ user(login:$login){ id } }' -f login="$OWNER" --jq '.data.user.id')

          echo "Looking for an existing project..."
          EXISTING_ID=$(gh api graphql -f query='query($login:String!){ user(login:$login){ projectsV2(first:100){ nodes { id title number url } } } }' -f login="$OWNER" --jq --arg title "$PROJECT_TITLE" '.data.user.projectsV2.nodes[] | select(.title==$title) | .id' | head -n1 || true)

          if [[ -n "${EXISTING_ID:-}" && "$RECREATE" != "true" ]]; then
            echo "Project already exists. Nothing to create."
            gh api graphql -f query='query($login:String!){ user(login:$login){ projectsV2(first:100){ nodes { id title number url } } } }' -f login="$OWNER" --jq --arg title "$PROJECT_TITLE" '.data.user.projectsV2.nodes[] | select(.title==$title) | {title,number,url}'
            exit 0
          fi

          echo "Creating project: $PROJECT_TITLE"
          PROJECT_ID=$(gh api graphql -f query='mutation($owner:ID!,$title:String!){ createProjectV2(input:{ownerId:$owner,title:$title}){ projectV2 { id number url title } } }' -F owner="$OWNER_ID" -f title="$PROJECT_TITLE" --jq '.data.createProjectV2.projectV2.id')

          PROJECT_URL=$(gh api graphql -f query='query($id:ID!){ node(id:$id){ ... on ProjectV2 { url number title } } }' -f id="$PROJECT_ID" --jq '.data.node.url')
          echo "PROJECT_URL=$PROJECT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Created: $PROJECT_URL"

          # The project is deliberately organized as independently testable phases.
          # Each phase issue is a usable development milestone with its own acceptance test.
          declare -a TITLES=(
            "[Phase 0] Project foundation"
            "[Phase 1] First usable route generator"
            "[Phase 2] Better route intelligence"
            "[Phase 3] Centralized regional data and offline datasets"
            "[Phase 4] Offline on-device AI"
            "[Phase 5] Community route intelligence"
            "[Phase 6] Expanded exports and interoperability"
            "[Phase 7] Advanced route discovery"
            "[Phase 8] Mature ecosystem integrations"
          )

          declare -a BODIES=(
            "## Goal\nEstablish the repository structure, architecture decisions, test strategy, and first geographic test region.\n\n## Deliverable\nA reproducible development workflow plus a defined region/data-pipeline target.\n\n## Work\n- Define module boundaries.\n- Define the first geographic test region.\n- Establish data/version conventions.\n- Establish representative route test cases and regression testing.\n\n## Acceptance test\nThe project can acquire the selected source data, identify its version, and run the initial data-processing tests."
            "## Goal\nProve the central route-discovery idea without AI or community complexity.\n\n## Capabilities\n- Start and destination\n- Basic bikepacking preferences\n- One regional dataset\n- Existing routing engine, with BRouter evaluated first\n- Bikepacking routing profile\n- Multiple candidate routes where practical\n- Basic statistics\n- Route display\n- GPX export\n\n## Explicitly excluded\nNavigation, live rerouting, accounts, social features, on-device AI, and direct navigation APIs.\n\n## Acceptance test\nA rider can enter two locations, generate useful bikepacking candidates, compare them, export one as GPX, and open/use it in an existing navigation application."
            "## Goal\nMake generated lines substantially better than basic bicycle routing.\n\n## Capabilities\n- Better surface classification\n- Better road/trail suitability\n- Access and legality handling\n- Better elevation analysis\n- Traffic/road-class penalties\n- More meaningful alternative generation\n- Route tradeoff explanations\n- More detailed statistics\n\n## Acceptance test\nThe same request produces materially different candidates with understandable tradeoffs, and real-world testing explains why candidates succeed or fail for a stated riding style."
            "## Goal\nBuild the centralized data foundation required for scalable offline planning.\n\n## Capabilities\n- Source-specific ingestion adapters\n- OSM normalization\n- Licensed government/public datasets\n- Legally usable community/specialized data\n- Geographic matching and deduplication\n- Provenance and confidence\n- Versioned regional datasets\n- Regional packaging\n- Incremental/delta updates\n\n## Acceptance test\nA phone can install a selected region, plan within it without a network connection, and update it incrementally without redownloading the complete region."
            "## Goal\nAdd conversational route planning without requiring a network connection.\n\n## Capabilities\n- Small specialized local model\n- Natural-language ride requests\n- Natural-language preference changes\n- Structured preference output\n- Candidate-route interpretation\n- Conversational route comparison\n- Offline operation with installed regional data\n\n## Critical boundary\nThe AI translates and evaluates. It does not invent route geometry.\n\n## Benchmark\nMeasure preference extraction accuracy, constraint consistency, ambiguity handling, resistance to hallucinated route facts, candidate comparison accuracy, model size, memory use, latency, and battery impact. Test multiple small models and keep the smallest model that meets the quality threshold.\n\n## Acceptance test\nA rider can describe a ride naturally, the offline model converts it into valid structured preferences, the routing engine generates candidates, and the model accurately explains their tradeoffs."
            "## Goal\nTurn completed rides into useful feedback for future route generation without turning Find-My-Line into a general social network.\n\n## Capabilities\n- Optional post-ride feedback\n- GPX/FIT import where available\n- Section-level feedback\n- Condition reports\n- Route reviews\n- Privacy controls\n- Anonymous/public contribution options\n- Time-decayed condition information\n- Feedback incorporated into route evaluation\n\n## Acceptance test\nA completed ride can be imported or submitted, sections can be evaluated, and repeated evidence measurably influences future route selection while preserving uncertainty and provenance."
            "## Goal\nReduce friction between route discovery and the rider's existing navigation tools.\n\n## Capabilities\n- KML/KMZ\n- GeoJSON\n- TCX\n- FIT where practical\n- Android share workflows\n- Direct handoff to compatible navigation applications\n- Direct track import where supported\n\n## Strategic rule\nInteroperability is additive. Portable GPX/FIT-style export remains available even when direct integrations exist.\n\n## Acceptance test\nA rider can send a generated line into supported navigation tools with substantially less manual work while Find-My-Line remains independently useful."
            "## Goal\nImprove discovery of lines riders would not normally connect manually.\n\n## Potential capabilities\n- Detect promising unconnected corridors\n- Compare against known/public route networks\n- Identify likely new connections\n- Detect likely hike-a-bike sections\n- Better remoteness/scenic estimates\n- Resupply and bailout intelligence\n- Improved condition prediction\n- Route novelty analysis\n- Advanced community-derived suitability signals\n\n## Acceptance test\nReal riders can identify useful route connections not obvious from existing published route collections, and field testing validates a meaningful proportion of discoveries."
            "## Goal\nMake Find-My-Line a route-discovery layer that works naturally with the broader navigation ecosystem.\n\n## Scope\nEvaluate integrations with navigation apps, GPS computers, route-management services, and other tools where APIs and agreements permit.\n\n## Strategic constraint\nThis phase comes last. Find-My-Line must first establish that its route-discovery engine and community/data intelligence are valuable independently.\n\n## Acceptance test\nSupported integrations reduce friction without making Find-My-Line dependent on any single navigation provider."
          )

          echo "Creating phased development issues and adding them to the project..."

          for i in "${!TITLES[@]}"; do
            TITLE="${TITLES[$i]}"
            BODY="${BODIES[$i]}"

            ISSUE_NUMBER=$(GH_TOKEN="$REPO_TOKEN" gh issue list --repo "$REPO" --state all --search "in:title \"$TITLE\"" --json number,title --jq --arg title "$TITLE" '.[] | select(.title==$title) | .number' | head -n1 || true)

            if [[ -z "${ISSUE_NUMBER:-}" ]]; then
              ISSUE_URL=$(GH_TOKEN="$REPO_TOKEN" gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY")
              ISSUE_NUMBER="${ISSUE_URL##*/}"
              echo "Created issue #$ISSUE_NUMBER: $TITLE"
            else
              echo "Issue #$ISSUE_NUMBER already exists: $TITLE"
            fi

            ISSUE_NODE_ID=$(GH_TOKEN="$REPO_TOKEN" gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json id --jq '.id')

            gh api graphql -f query='mutation($project:ID!,$content:ID!){ addProjectV2ItemById(input:{projectId:$project,contentId:$content}){ item { id } } }' -f project="$PROJECT_ID" -f content="$ISSUE_NODE_ID" >/dev/null
          done

          echo ""
          echo "=============================================="
          echo "Find-My-Line Project setup complete"
          echo "$PROJECT_URL"
          echo "=============================================="
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "# Find-My-Line Project" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Project created/configured: **[$PROJECT_TITLE]($PROJECT_URL)**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Phased development backlog: 9 milestone issues (Phase 0 through Phase 8)" >> "$GITHUB_STEP_SUMMARY"
          echo "Each phase has an explicit deliverable and acceptance test; Phase 1 is the first usable product." >> "$GITHUB_STEP_SUMMARY"
